<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="{{.BasePath}}static/favicon.ico">
    <title>Coroot</title>
    <link rel="stylesheet" href="{{.BasePath}}static/css/fonts.css">
    <link rel="stylesheet" href="{{.BasePath}}static/css/mdi.css">
    <script>
        window.coroot = {
            base_path: '{{.BasePath}}',
            version: '{{.Version}}',
            instance_uuid: '{{.InstanceUUID}}',
            check_for_updates: {{.CheckForUpdates}},
            edition: '{{.Edition}}',
            cloud_url: '{{.CloudURL}}',
        };
        // Kubero handoff: apply ?theme= / coroot_theme cookie BEFORE the Vue
        // bundle loads so a stale localStorage theme ("auto") can't win.
        (function () {
            try {
                var m = /(?:^|[?&])theme=(light|dark|auto)(?:&|$)/.exec(location.search || '');
                var theme = m && m[1];
                if (!theme) {
                    var cm = document.cookie.match(/(?:^|; )coroot_theme=(light|dark|auto)(?:;|$)/);
                    theme = cm && cm[1];
                }
                if (!theme) return;
                var data = {};
                try { data = JSON.parse(localStorage.getItem('coroot') || '{}') || {}; } catch (e) {}
                data.theme = theme;
                localStorage.setItem('coroot', JSON.stringify(data));
                var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.style.backgroundColor = '#1e1e1e';
            } catch (e) {}
        })();
    </script>
</head>
<body>
<noscript>
    <strong>We're sorry but Coroot doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>
</body>
</html>
