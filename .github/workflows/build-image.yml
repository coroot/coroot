name: Build Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Same office host / label pattern as other stackblaze image builds
    # (gh-runner-02, docker + buildx installed).
    runs-on: [self-hosted, kubero]
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: bash "$GITHUB_WORKSPACE/.github/scripts/reclaim-runner-disk.sh"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build frontend
        working-directory: ./front
        run: |
          npm ci
          npm run build-prod

      # Named builder + cleanup:false so BuildKit cache persists on the
      # self-hosted runner (ephemeral builders are deleted in post).
      - uses: docker/setup-buildx-action@v3
        with:
          name: kubero-shared-builder
          cleanup: false

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          # Local buildx cache on the self-hosted runner; avoid type=gha.

      # No rollout here. Coroot is PER REGION (coroot.stackblaze.cloud is
      # retired): each region pins an exact SHA tag via region-provisioner's
      # coroot_server_image and deploys through coroot-observability-cluster.
      # The old central rollout used KUBECONFIG_B64_COROOT, whose LAN target
      # only the retired office runner could reach — from any regional runner
      # it fails with "no route to host".

  # The dev loop: a push to `dev` rolls the freshly built image onto the
  # coroot-dev instance (leaseweb ns coroot-dev → coroot-dev.stackblaze.cloud)
  # so the build is immediately visible, exactly like dashboard-dev. Regions
  # are untouched — they only ever run the SHA pinned in region-provisioner.
  # The dev Coroot lives on the region's SERVICES cluster (us-west-1), beside
  # the workloads it observes and beside the region's own Coroot — not on
  # leaseweb. That cluster is LAN-only, so rolling it means dispatching
  # region-provisioner's coroot-dev workflow (which runs on an in-region
  # runner) with this build's image, rather than kubectl from here.
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-and-push
    runs-on: [self-hosted, kubero]
    steps:
      - name: Roll the dev Coroot to this build
        env:
          GH_TOKEN: ${{ secrets.REGION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::REGION_ADMIN_TOKEN missing — needed to dispatch region-provisioner"; exit 1; }
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          gh workflow run coroot-dev.yml \
            --repo stackblaze/region-provisioner \
            -f slug=us-west-1 \
            -f image="ghcr.io/stackblaze/coroot:${SHORT}"
          echo "dispatched: dev Coroot → ghcr.io/stackblaze/coroot:${SHORT} (us-west-1 services cluster)"

  # Option B (2026-08-23): merging to main rolls prod THROUGH THE CANARY —
  # region-provisioner's coroot-prod-rollout deploys West, health-gates it,
  # and only then rolls east+central and bumps the pin. A bad image stops at
  # one region. Nothing here deploys directly.
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: [self-hosted, kubero]
    steps:
      - name: Dispatch the canary-gated rollout
        env:
          GH_TOKEN: ${{ secrets.REGION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::REGION_ADMIN_TOKEN missing"; exit 1; }
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          gh workflow run coroot-prod-rollout.yml \
            --repo stackblaze/region-provisioner \
            -f image="ghcr.io/stackblaze/coroot:${SHORT}"
          echo "dispatched canary rollout for ghcr.io/stackblaze/coroot:${SHORT}"
