name: Build Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Same office host / label pattern as other stackblaze image builds
    # (gh-runner-02, docker + buildx installed).
    runs-on: [self-hosted, kubero]
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: bash "$GITHUB_WORKSPACE/.github/scripts/reclaim-runner-disk.sh"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build frontend
        working-directory: ./front
        run: |
          npm ci
          npm run build-prod

      # Named builder + cleanup:false so BuildKit cache persists on the
      # self-hosted runner (ephemeral builders are deleted in post).
      - uses: docker/setup-buildx-action@v3
        with:
          name: kubero-shared-builder
          cleanup: false

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          # Local buildx cache on the self-hosted runner; avoid type=gha.

      # No rollout here. Coroot is PER REGION (coroot.stackblaze.cloud is
      # retired): each region pins an exact SHA tag via region-provisioner's
      # coroot_server_image and deploys through coroot-observability-cluster.
      # The old central rollout used KUBECONFIG_B64_COROOT, whose LAN target
      # only the retired office runner could reach — from any regional runner
      # it fails with "no route to host".

  # The dev loop: a push to `dev` rolls the freshly built image onto the
  # coroot-dev instance (leaseweb ns coroot-dev → coroot-dev.stackblaze.cloud)
  # so the build is immediately visible, exactly like dashboard-dev. Regions
  # are untouched — they only ever run the SHA pinned in region-provisioner.
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-and-push
    runs-on: [self-hosted, kubero]
    steps:
      - name: kubectl
        run: |
          set -euo pipefail
          BIN="$HOME/.local/bin"; mkdir -p "$BIN"; echo "$BIN" >> "$GITHUB_PATH"; export PATH="$BIN:$PATH"
          command -v kubectl >/dev/null 2>&1 || { curl -fsSL -o "$BIN/kubectl" "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"; chmod +x "$BIN/kubectl"; }
      - name: Roll coroot-dev to this build
        env:
          KUBECONFIG_B64_LEASEWEB: ${{ secrets.KUBECONFIG_B64_LEASEWEB }}
        run: |
          set -euo pipefail
          [ -n "${KUBECONFIG_B64_LEASEWEB:-}" ] || { echo "::error::KUBECONFIG_B64_LEASEWEB missing"; exit 1; }
          mkdir -p "$HOME/.kube"; printf '%s' "$KUBECONFIG_B64_LEASEWEB" | base64 -d > "$HOME/.kube/config"; chmod 600 "$HOME/.kube/config"
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          kubectl -n coroot-dev set image deployment/coroot coroot="ghcr.io/stackblaze/coroot:${SHORT}"
          kubectl -n coroot-dev rollout status deployment/coroot --timeout=300s
          echo "coroot-dev now runs ${SHORT} → https://coroot-dev.stackblaze.cloud"

