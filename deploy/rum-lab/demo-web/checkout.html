<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Nord Outfitters</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Nord Outfitters</a>
    <nav>
      <a href="/" data-nav>Home</a>
      <a href="/shop.html" data-nav>Shop</a>
      <a href="/checkout.html" data-nav class="active">Checkout</a>
    </nav>
    <span class="badge" id="rum-status">RUM: starting…</span>
  </header>

  <main>
    <section class="checkout">
      <h1>Checkout</h1>
      <p>Places an order through <code>demo-checkout:4001/api/checkout</code> (fetch + traceparent).</p>
      <form id="checkout-form" class="form">
        <label>
          Email
          <input name="email" type="email" value="demo@example.com" autocomplete="email" />
        </label>
        <label>
          Card
          <input name="card" type="text" value="4242 4242 4242 4242" autocomplete="off" data-coroot-mask />
        </label>
        <div class="actions">
          <button class="btn primary" type="submit">Place order</button>
          <button class="btn danger" type="button" id="btn-fail">Fail payment</button>
        </div>
      </form>
      <div id="order-result" class="result" hidden></div>
    </section>
    <section class="log-panel">
      <h2>Client log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="http://localhost:8080/static/rum/coroot-rum.js"></script>
  <script src="/js/rum-config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
