<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Nord Outfitters</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Nord Outfitters</a>
    <nav>
      <a href="/" data-nav>Home</a>
      <a href="/shop.html" data-nav class="active">Shop</a>
      <a href="/checkout.html" data-nav>Checkout</a>
    </nav>
    <span class="badge" id="rum-status">RUM: starting…</span>
  </header>

  <main>
    <section>
      <h1>Shop</h1>
      <p>Soft navigations and XHR are recorded by the RUM SDK.</p>
      <div class="actions">
        <button class="btn primary" id="btn-load">Refresh via XHR</button>
        <a class="btn" href="/checkout.html" data-nav>Go to checkout</a>
      </div>
      <div id="products" class="grid">Loading…</div>
    </section>
    <section class="log-panel">
      <h2>Client log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="http://localhost:8080/static/rum/coroot-rum.js"></script>
  <script src="/js/rum-config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
