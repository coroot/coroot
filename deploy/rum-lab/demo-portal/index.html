<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harbor Help — RUM demo portal</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Harbor Help</a>
    <nav>
      <a href="/" data-nav>Home</a>
      <a href="/tickets.html" data-nav>Tickets</a>
      <a href="/status.html" data-nav>Status</a>
    </nav>
    <span class="badge" id="rum-status">RUM: starting…</span>
  </header>

  <main>
    <section class="hero">
      <h1>Support that stays afloat</h1>
      <p>Second RUM site (<code>demo-portal</code>) → <code>demo-portal-api</code> → shared Postgres/Valkey.</p>
      <div class="actions">
        <a class="btn primary" href="/tickets.html" data-nav>Open tickets</a>
        <button class="btn" id="btn-load">Refresh tickets</button>
        <button class="btn danger" id="btn-error">Throw JS error</button>
      </div>
    </section>

    <section>
      <h2>Recent tickets</h2>
      <div id="tickets" class="grid">Loading…</div>
    </section>

    <section class="log-panel">
      <h2>Client log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="http://localhost:8080/static/rum/coroot-rum.js"></script>
  <script src="/js/rum-config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
