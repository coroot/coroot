# Coroot RUM local test stand
# Build from current sources (dev.dockerfile) + ClickHouse + Prometheus + agents + demo site.
#
# Usage:
#   cd deploy/rum-lab
#   docker compose up -d --build
#
# UI:   http://localhost:8080
# Demo: http://localhost:3000
# RUM key (preconfigured): rum-local-key-000000000000000001

name: coroot-rum-lab

services:
  coroot:
    restart: unless-stopped
    build:
      context: ../..
      # Frontend is built on the host (npm in Docker hangs on some macOS setups).
      # Run: cd front && npm ci && npm run build-prod
      dockerfile: deploy/rum-lab/Dockerfile
      args:
        VERSION: rum-lab-local
    image: coroot-rum-lab:local
    user: root
    volumes:
      - coroot_data:/data
      - ./coroot-config.yaml:/config/coroot.yaml:ro
    ports:
      - "8080:8080"
    command:
      - "--config=/config/coroot.yaml"
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  demo-web:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./demo-web:/usr/share/nginx/html:ro
      - ./demo-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      coroot:
        condition: service_healthy
      demo-api:
        condition: service_started
      demo-checkout:
        condition: service_started

  # Second frontend (Harbor Help) — separate RUM serviceName + own backend.
  demo-portal:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "3001:80"
    volumes:
      - ./demo-portal:/usr/share/nginx/html:ro
      - ./demo-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      coroot:
        condition: service_healthy
      demo-portal-api:
        condition: service_started

  # Two catalog instances behind demo-api LB. All lab shims share one machine_id/hostname
  # (single Docker Desktop node). Distinct container_ids + customApplications → one app, two instances.
  demo-api-1: &demo-api-instance
    restart: unless-stopped
    build:
      context: ./demo-api
    image: coroot-rum-lab-demo-api:local
    environment: &demo-api-env
      LISTEN: "0.0.0.0:4000"
      COROOT_OTLP_ENDPOINT: "http://coroot:8080/v1/traces"
      COROOT_LOGS_URL: "http://coroot:8080/v1/logs"
      COROOT_METRICS_URL: "http://coroot:8080/v1/metrics"
      COROOT_API_KEY: "agent-local-key-0000000000000001"
      SERVICE_NAME: "demo-api"
      SERVICE_VERSION: "1.0.0"
      APP_ROLE: "catalog"
      DEMO_MACHINE_ID: "rumlabdemomachine000000000000001"
      DEMO_SYSTEM_UUID: "rumlabdemosystemuuid0000000000001"
      DEMO_HOSTNAME: "rum-lab-node"
      DEMO_CONTAINER_ID: "/docker/demo-api-1"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      METRICS_INTERVAL_SEC: "10"
      PROFILES_INTERVAL_SEC: "45"
      COROOT_PROFILES_URL: "http://coroot:8080/v1/profiles"
      DATABASE_URL: "postgresql://shop:shop@demo-postgres:5432/shop"
      PG_HOST: "demo-postgres"
      PG_PORT: "5432"
      REDIS_URL: "redis://demo-valkey:6379/0"
      VALKEY_HOST: "demo-valkey"
      VALKEY_PORT: "6379"
    depends_on:
      coroot:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
      demo-valkey:
        condition: service_healthy
    healthcheck: &demo-api-health
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4000/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  demo-api-2:
    <<: *demo-api-instance
    environment:
      <<: *demo-api-env
      DEMO_CONTAINER_ID: "/docker/demo-api-2"

  # Load balancer keeps http://localhost:4000 and DNS name demo-api stable.
  demo-api:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "4000:4000"
    volumes:
      - ./demo-api/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      demo-api-1:
        condition: service_healthy
      demo-api-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4000/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # Second backend app: checkout / orders (same image, different role + identity).
  demo-checkout:
    restart: unless-stopped
    image: coroot-rum-lab-demo-api:local
    ports:
      - "4001:4001"
    environment:
      LISTEN: "0.0.0.0:4001"
      COROOT_OTLP_ENDPOINT: "http://coroot:8080/v1/traces"
      COROOT_LOGS_URL: "http://coroot:8080/v1/logs"
      COROOT_METRICS_URL: "http://coroot:8080/v1/metrics"
      COROOT_API_KEY: "agent-local-key-0000000000000001"
      SERVICE_NAME: "demo-checkout"
      SERVICE_VERSION: "1.0.0"
      APP_ROLE: "checkout"
      DEMO_MACHINE_ID: "rumlabdemomachine000000000000001"
      DEMO_SYSTEM_UUID: "rumlabdemosystemuuid0000000000001"
      DEMO_HOSTNAME: "rum-lab-node"
      DEMO_CONTAINER_ID: "/docker/demo-checkout"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      METRICS_INTERVAL_SEC: "10"
      PROFILES_INTERVAL_SEC: "45"
      COROOT_PROFILES_URL: "http://coroot:8080/v1/profiles"
      DATABASE_URL: "postgresql://shop:shop@demo-postgres:5432/shop"
      PG_HOST: "demo-postgres"
      PG_PORT: "5432"
      REDIS_URL: "redis://demo-valkey:6379/0"
      VALKEY_HOST: "demo-valkey"
      VALKEY_PORT: "6379"
    depends_on:
      coroot:
        condition: service_healthy
      demo-api:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
      demo-valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4001/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Portal backend (Harbor Help) — separate OTEL service, shared Postgres/Valkey.
  demo-portal-api:
    restart: unless-stopped
    image: coroot-rum-lab-demo-api:local
    ports:
      - "4002:4002"
    environment:
      LISTEN: "0.0.0.0:4002"
      COROOT_OTLP_ENDPOINT: "http://coroot:8080/v1/traces"
      COROOT_LOGS_URL: "http://coroot:8080/v1/logs"
      COROOT_METRICS_URL: "http://coroot:8080/v1/metrics"
      COROOT_API_KEY: "agent-local-key-0000000000000001"
      SERVICE_NAME: "demo-portal-api"
      SERVICE_VERSION: "1.0.0"
      APP_ROLE: "portal"
      DEMO_MACHINE_ID: "rumlabdemomachine000000000000001"
      DEMO_SYSTEM_UUID: "rumlabdemosystemuuid0000000000001"
      DEMO_HOSTNAME: "rum-lab-node"
      DEMO_CONTAINER_ID: "/docker/demo-portal-api"
      ALLOWED_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"
      METRICS_INTERVAL_SEC: "10"
      PROFILES_INTERVAL_SEC: "45"
      COROOT_PROFILES_URL: "http://coroot:8080/v1/profiles"
      DATABASE_URL: "postgresql://shop:shop@demo-postgres:5432/shop"
      PG_HOST: "demo-postgres"
      PG_PORT: "5432"
      REDIS_URL: "redis://demo-valkey:6379/0"
      VALKEY_HOST: "demo-valkey"
      VALKEY_PORT: "6379"
    depends_on:
      coroot:
        condition: service_healthy
      demo-api:
        condition: service_started
      demo-postgres:
        condition: service_healthy
      demo-valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4002/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  demo-postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./demo-postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  demo-valkey:
    restart: unless-stopped
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Shim metrics for demo-postgres (listen + CPU) so Coroot can attach cluster-agent pg_* series.
  demo-pg-metrics:
    restart: unless-stopped
    build:
      context: ./demo-pg-metrics
    image: coroot-rum-lab-demo-pg-metrics:local
    environment:
      COROOT_METRICS_URL: "http://coroot:8080/v1/metrics"
      COROOT_API_KEY: "agent-local-key-0000000000000001"
      SERVICE_NAME: "demo-postgres"
      LISTEN_HOST: "demo-postgres"
      LISTEN_PORT: "5432"
      APPLICATION_TYPE: "postgres"
      CONTAINER_IMAGE: "postgres:16-alpine"
      DEMO_MACHINE_ID: "rumlabdemomachine000000000000001"
      DEMO_SYSTEM_UUID: "rumlabdemosystemuuid0000000000001"
      DEMO_HOSTNAME: "rum-lab-node"
      DEMO_CONTAINER_ID: "/docker/demo-postgres"
      METRICS_INTERVAL_SEC: "10"
    depends_on:
      coroot:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy

  demo-valkey-metrics:
    restart: unless-stopped
    image: coroot-rum-lab-demo-pg-metrics:local
    environment:
      COROOT_METRICS_URL: "http://coroot:8080/v1/metrics"
      COROOT_API_KEY: "agent-local-key-0000000000000001"
      SERVICE_NAME: "demo-valkey"
      LISTEN_HOST: "demo-valkey"
      LISTEN_PORT: "6379"
      APPLICATION_TYPE: "valkey"
      CONTAINER_IMAGE: "valkey/valkey:8-alpine"
      DEMO_MACHINE_ID: "rumlabdemomachine000000000000001"
      DEMO_SYSTEM_UUID: "rumlabdemosystemuuid0000000000001"
      DEMO_HOSTNAME: "rum-lab-node"
      DEMO_CONTAINER_ID: "/docker/demo-valkey"
      METRICS_INTERVAL_SEC: "10"
    depends_on:
      coroot:
        condition: service_healthy
      demo-valkey:
        condition: service_healthy
      demo-pg-metrics:
        condition: service_started

  # Synthetic browser+API traffic for both sites (shop + portal).
  demo-traffic:
    restart: unless-stopped
    build:
      context: ./demo-traffic
    image: coroot-rum-lab-demo-traffic:local
    environment:
      INTERVAL_SEC: "5"
      JITTER_SEC: "2"
      ERROR_RATE: "0.25"
      SLOW_RATE: "0.15"
      SHOP_WEIGHT: "0.6"
      PORTAL_WEIGHT: "0.4"
      COROOT_OTLP_ENDPOINT: "http://coroot:8080/v1/traces"
      RUM_API_KEY: "rum-local-key-000000000000000001"
      RUM_ORIGIN: "http://localhost:3000"
      RUM_SERVICE_NAME: "demo-web"
      API_BASE: "http://demo-api:4000"
      API_HOST: "localhost:4000"
      PEER_SERVICE: "demo-api"
      CHECKOUT_BASE: "http://demo-checkout:4001"
      CHECKOUT_HOST: "localhost:4001"
      CHECKOUT_PEER_SERVICE: "demo-checkout"
      PORTAL_RUM_ORIGIN: "http://localhost:3001"
      PORTAL_RUM_SERVICE_NAME: "demo-portal"
      PORTAL_API_BASE: "http://demo-portal-api:4002"
      PORTAL_API_HOST: "localhost:4002"
      PORTAL_PEER_SERVICE: "demo-portal-api"
    depends_on:
      coroot:
        condition: service_healthy
      demo-api:
        condition: service_healthy
      demo-checkout:
        condition: service_healthy
      demo-portal-api:
        condition: service_healthy

  cluster-agent:
    restart: unless-stopped
    image: ghcr.io/coroot/coroot-cluster-agent
    pull_policy: always
    volumes:
      - cluster_agent_data:/data
      - ./cluster-agent-config.yaml:/config/config.yaml:ro
    command:
      - "--coroot-url=http://coroot:8080"
      - "--api-key=agent-local-key-0000000000000001"
      - "--metrics-scrape-interval=15s"
      - "--metrics-wal-dir=/data"
      - "--config-file=/config/config.yaml"
    depends_on:
      coroot:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
      demo-valkey:
        condition: service_healthy

  # eBPF node-agent needs a Linux host with tracing; on Docker Desktop (macOS) it often fails — optional.
  node-agent:
    profiles: ["ebpf"]
    restart: unless-stopped
    image: ghcr.io/coroot/coroot-node-agent
    pull_policy: always
    privileged: true
    pid: "host"
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/cgroup:/host/sys/fs/cgroup
      - node_agent_data:/data
    command:
      - "--collector-endpoint=http://coroot:8080"
      - "--api-key=agent-local-key-0000000000000001"
      - "--cgroupfs-root=/host/sys/fs/cgroup"
      - "--wal-dir=/data"
    depends_on:
      coroot:
        condition: service_healthy

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.53.5
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    configs:
      - source: clickhouse_logging
        target: /etc/clickhouse-server/config.d/logging_rules.xml
      - source: clickhouse_user_logging
        target: /etc/clickhouse-server/config.d/user_logging.xml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  prometheus_data: {}
  clickhouse_data: {}
  clickhouse_logs: {}
  coroot_data: {}
  cluster_agent_data: {}
  node_agent_data: {}
  demo_postgres_data: {}

configs:
  clickhouse_logging:
    content: |
      <clickhouse>
        <logger>
            <level>warning</level>
            <console>true</console>
        </logger>
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
        <latency_log remove="remove"/>
        <processors_profile_log remove="remove"/>
      </clickhouse>
  clickhouse_user_logging:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
            <log_processors_profiles>0</log_processors_profiles>
          </default>
        </profiles>
      </clickhouse>
